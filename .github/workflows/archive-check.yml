name: Weekly Archive check

on:
  schedule:
    - cron: '17 14 * * 0' # Sundays 14:17 UTC (8:17 AM Central), the day before each new schedule week
  workflow_dispatch:
    inputs:
      items:
        description: Only these Archive identifiers, comma-separated (blank checks everything)
        required: false
        default: ''
      report:
        description: File the results in the GitHub issue (full checks only)
        type: boolean
        default: true

permissions:
  contents: write # commits next week's snapshot
  issues: write
  actions: write # starts CI, which republishes the site

concurrency:
  group: archive-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the catalog
        run: python3 tools/build.py
      - name: Check every Archive file
        id: check
        env:
          ITEMS: ${{ inputs.items }}
        run: node tools/archive_check.js --items "$ITEMS"
      - name: File the results in an issue
        if: steps.check.outcome == 'success' && !inputs.items && (github.event_name == 'schedule' || inputs.report)
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
          HASH: ${{ steps.check.outputs.hash }}
          TITLE: ${{ steps.check.outputs.title }}
          FILES: ${{ steps.check.outputs.files }}
        run: bash tools/archive_check_issue.sh
      # New catalog files, files whose length changed, and any that failed last time get measured, one at
      # a time; the levels table is rebuilt from the measurements, and the snapshot below carries it.
      - name: Measure new and changed files, and rebuild the levels
        if: always() && steps.check.outcome == 'success' && !inputs.items
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          node tools/loudness_survey.js selftest
          node tools/loudness_survey.js pick all dist/all.json
          node tools/loudness_survey.js measure dist/all.json catalog/measurements.json --retry-errors --redo-from dist/archive-check.json
          node tools/levels.js catalog/measurements.json catalog/levels.json
      - name: Draft next week's snapshot
        id: snap
        if: always() && steps.check.outcome == 'success' && !inputs.items
        run: python3 tools/snapshot.py --exclude-from dist/archive-check.json
      - name: Save the snapshot and republish
        if: always() && steps.snap.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- snapshots catalog/measurements.json catalog/levels.json)" ]; then echo "Next week schedules from the snapshot already in place."; exit 0; fi
          week=$(cd tools && python3 -c 'import datetime, ndlib; print(ndlib.week_date(ndlib.week_index(datetime.datetime.now(datetime.timezone.utc)) + 1))')
          snap=$(git status --porcelain -- snapshots)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A snapshots catalog/measurements.json catalog/levels.json
          git commit -m "$([ -n "$snap" ] && echo "Snapshot for the week of $week" || echo "Levels for new and changed catalog files")"
          git pull --rebase -q origin main
          git push origin HEAD:main
          # The page carries the snapshots, so a new one means republishing. A push made with this workflow's
          # token starts no other workflow, so start CI by hand.
          if [ -n "$snap" ]; then gh workflow run ci.yml --ref main; fi
