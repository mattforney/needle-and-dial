name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch: # the weekly Archive check starts this after saving a snapshot

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        run: python3 tools/build.py
      - name: Schedule checks
        run: node tools/test_engine.js
      - name: Archive check logic
        run: node tools/test_archive_check.js
      - name: Snapshot tool
        run: python3 tools/test_snapshot.py
      - name: Log checker
        run: node tools/test_check_log.js
      - name: Install test tools
        run: npm ci
      - name: Playback checks
        run: node tools/test_playback.js
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # Publishes main to GitHub Pages through the gh-pages branch, only after the build and every check pass.
  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: python3 tools/build.py
      - name: Push the site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
