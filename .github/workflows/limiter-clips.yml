# Renders listening clips (tools/limiter_check.js clips) for the files in
# research/loudness/limiter/wpge-readings.json and commits them to this branch, under
# research/loudness/limiter/clips/ (a workflow artifact can't be fetched from every machine).
# It runs only on the limiter-clips branch, so main and the site are untouched.
name: Limiter clips

on:
  push:
    branches: [limiter-clips]
    paths: [research/loudness/limiter/wpge-readings.json, tools/limiter_check.js, .github/workflows/limiter-clips.yml]

permissions:
  contents: write

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the test tools and ffmpeg
        run: |
          npm ci
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
      - name: Render the clips
        run: node tools/limiter_check.js clips research/loudness/limiter/wpge-readings.json dist/clips 3 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Commit the clips
        run: |
          rm -rf research/loudness/limiter/clips && mkdir -p research/loudness/limiter/clips && cp dist/clips/* research/loudness/limiter/clips/
          git add research/loudness/limiter/clips
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Limiter clips [skip ci]"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
