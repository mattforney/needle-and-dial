# Records each station's announcements (tools/voices/scripts.txt) in its chosen Kokoro voice, one MP3 per
# line levelled to the programs' loudness, and puts them on the voice-package branch, which holds nothing
# but the latest recording (each run replaces it), for the review page and, once approved, the site.
name: Voice package

on:
  workflow_dispatch:
    inputs:
      only:
        description: Only these stations, comma-separated keys (blank records every station in the scripts)
        required: false
        default: ''
  push:
    branches: [voices]
    paths: [tools/voices/package.py, tools/voices/scripts.txt, .github/workflows/voice-package.yml]

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kokoro, on the CPU
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile huggingface_hub
          python -m spacy download en_core_web_sm
      - name: Record
        env:
          ONLY: ${{ inputs.only }}
        run: python tools/voices/package.py out --only "$ONLY"
      - name: Replace the voice-package branch with this recording
        working-directory: out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b voice-package
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "Voice package, run ${{ github.run_id }} from ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" voice-package
